name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: shellcheck -S warning bin/* tests/smoke.sh
      - name: Run smoke tests
        run: bash tests/smoke.sh

  smoke-macos:
    # macOS ships bash 3.2 and BWK awk — the portability check for bin/.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke tests
        run: bash tests/smoke.sh

  mod:
    # The mod (hooks/mod/): static validation and its tests run offline, with no sign-in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin and its hooks module
        run: claude plugin validate .
      - name: Run the mod tests
        run: claude plugin test .
