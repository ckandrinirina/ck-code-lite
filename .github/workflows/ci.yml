name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: shellcheck -S warning bin/* scripts/*.sh tests/smoke.sh
      - name: Run smoke tests
        run: bash tests/smoke.sh

  smoke-macos:
    # macOS ships bash 3.2 and BWK awk — the portability check for bin/.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke tests
        run: bash tests/smoke.sh
